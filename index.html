<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>شات</title>
<style>
  :root {
    --bg: #ece5dd;
    --header: #075e54;
    --mine: #dcf8c6;
    --other: #ffffff;
    --accent: #128c7e;
    --text: #111;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); }

  /* شاشة الدخول */
  #login {
    position: fixed; inset: 0; background: var(--header);
    display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px;
  }
  .login-box { background: #fff; padding: 28px 24px; border-radius: 14px; width: 100%; max-width: 340px; text-align: center; }
  .login-box h1 { margin-bottom: 6px; color: var(--header); }
  .login-box p { color: #666; margin-bottom: 18px; font-size: 14px; }
  .login-box input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-bottom: 12px; }
  .login-box button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; font-size: 16px; cursor: pointer; }

  /* التطبيق */
  #app { display: flex; flex-direction: column; height: 100%; max-width: 760px; margin: 0 auto; background: var(--bg); box-shadow: 0 0 20px rgba(0,0,0,.15); }
  header { background: var(--header); color: #fff; padding: 12px 16px; }
  header h2 { font-size: 18px; }
  #status { font-size: 12px; opacity: .85; margin-top: 2px; min-height: 16px; }

  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 8px 10px; border-radius: 10px; background: var(--other); box-shadow: 0 1px 1px rgba(0,0,0,.12); word-wrap: break-word; }
  .msg.mine { align-self: flex-start; background: var(--mine); }   /* RTL: flex-start = يمين */
  .msg.other { align-self: flex-end; }
  .msg .name { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 3px; }
  .msg .body { white-space: pre-wrap; line-height: 1.5; }
  .msg .time { font-size: 10px; color: #888; margin-top: 4px; text-align: left; }
  .msg img, .msg video { display: block; max-width: 100%; max-height: 320px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; background: #000; }
  .msg video { cursor: default; }

  /* شريط الكتابة */
  #composer { background: #f0f0f0; padding: 8px; display: flex; align-items: flex-end; gap: 6px; }
  #composer textarea { flex: 1; resize: none; border: 0; border-radius: 20px; padding: 10px 14px; font-size: 16px; font-family: inherit; max-height: 110px; outline: none; }
  .icon-btn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0; }
  .icon-btn.attach { background: #e0e0e0; color: #444; }

  /* معاينة المرفق */
  #preview { display: none; background: #fafafa; border-top: 1px solid #ddd; padding: 8px 12px; align-items: center; gap: 10px; }
  #preview.show { display: flex; }
  #preview .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; background: #000; }
  #preview .info { flex: 1; font-size: 13px; color: #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #preview button { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: #c00; }
  #progress { height: 3px; background: var(--accent); width: 0; transition: width .15s; }

  /* عرض الصورة بحجم كبير */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 20; }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 95%; max-height: 95%; }
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>💬 شات</h1>
    <p>اكتب اسمك عشان تدخل</p>
    <input id="nameInput" maxlength="30" placeholder="اسمك" autofocus>
    <button id="joinBtn">دخول</button>
  </div>
</div>

<div id="app">
  <header>
    <h2>💬 الشات العام</h2>
    <div id="status"></div>
  </header>

  <div id="messages"></div>

  <div id="progress"></div>
  <div id="preview">
    <img class="thumb" id="thumbImg" style="display:none">
    <video class="thumb" id="thumbVid" style="display:none" muted></video>
    <div class="info" id="fileInfo"></div>
    <button id="cancelFile" title="إلغاء">✕</button>
  </div>

  <div id="composer">
    <input type="file" id="fileInput" accept="image/*,video/*" hidden>
    <button class="icon-btn attach" id="attachBtn" title="إرفاق صورة أو فيديو">📎</button>
    <textarea id="textInput" rows="1" placeholder="اكتب رسالة..."></textarea>
    <button class="icon-btn" id="sendBtn" title="إرسال">➤</button>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let username = localStorage.getItem('chat_name') || '';
let pendingFile = null;
let typingTimer = null;
let lastTypingSent = 0;

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');

// ---------- الدخول ----------
function join() {
  const name = $('nameInput').value.trim();
  if (!name) return;
  username = name;
  localStorage.setItem('chat_name', name);
  $('login').style.display = 'none';
  socket.emit('join', username);
  $('textInput').focus();
}
$('joinBtn').onclick = join;
$('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
if (username) { $('nameInput').value = username; join(); }

socket.on('connect', () => { if (username) socket.emit('join', username); });

// ---------- عرض الرسائل ----------
function fmtTime(t) {
  return new Date(t).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
}

function renderMessage(m) {
  const div = document.createElement('div');
  div.className = 'msg ' + (m.user === username ? 'mine' : 'other');

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = m.user;
  if (m.user !== username) div.appendChild(name);

  if (m.type === 'image') {
    const img = document.createElement('img');
    img.src = m.url;
    img.loading = 'lazy';
    img.onload = scrollDown;
    img.onclick = () => { $('lightboxImg').src = m.url; $('lightbox').classList.add('show'); };
    div.appendChild(img);
  } else if (m.type === 'video') {
    const v = document.createElement('video');
    v.src = m.url;
    v.controls = true;
    v.preload = 'metadata';
    v.playsInline = true;
    v.onloadedmetadata = scrollDown;
    div.appendChild(v);
  }

  if (m.text) {
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = m.text;   // textContent => آمن من XSS
    div.appendChild(body);
  }

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = fmtTime(m.time);
  div.appendChild(time);

  messagesEl.appendChild(div);
}

function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

socket.on('history', (list) => {
  messagesEl.innerHTML = '';
  list.forEach(renderMessage);
  scrollDown();
});
socket.on('message', (m) => { renderMessage(m); scrollDown(); });

socket.on('online', (names) => {
  $('status').textContent = names.length + ' متصل: ' + names.join('، ');
});

socket.on('typing', (name) => {
  if (name === username) return;
  const el = $('status');
  const old = el.dataset.base || el.textContent;
  el.dataset.base = old;
  el.textContent = name + ' بيكتب...';
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { el.textContent = el.dataset.base; delete el.dataset.base; }, 1500);
});

// ---------- إرسال نص ----------
function sendText() {
  const text = $('textInput').value.trim();
  if (pendingFile) return sendFile(text);
  if (!text) return;
  socket.emit('text', { user: username, text });
  $('textInput').value = '';
  autoGrow();
}
$('sendBtn').onclick = sendText;
$('textInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
$('textInput').addEventListener('input', () => {
  autoGrow();
  const now = Date.now();
  if (now - lastTypingSent > 1000) { socket.emit('typing', username); lastTypingSent = now; }
});
function autoGrow() {
  const t = $('textInput');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 110) + 'px';
}

// ---------- اختيار ملف ----------
$('attachBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = (e) => {
  const f = e.target.files[0];
  if (f) setPending(f);
  e.target.value = '';
};
$('cancelFile').onclick = clearPending;

function setPending(file) {
  const isImg = file.type.startsWith('image/');
  const isVid = file.type.startsWith('video/');
  if (!isImg && !isVid) return alert('اختار صورة أو فيديو بس');
  if (file.size > 50 * 1024 * 1024) return alert('حجم الملف أكبر من 50 ميجا');

  pendingFile = file;
  const url = URL.createObjectURL(file);
  $('thumbImg').style.display = isImg ? 'block' : 'none';
  $('thumbVid').style.display = isVid ? 'block' : 'none';
  if (isImg) $('thumbImg').src = url; else $('thumbVid').src = url;
  $('fileInfo').textContent = file.name + ' (' + (file.size / 1048576).toFixed(1) + ' MB)';
  $('preview').classList.add('show');
  $('textInput').placeholder = 'أضف تعليق (اختياري)...';
  $('textInput').focus();
}
function clearPending() {
  pendingFile = null;
  $('preview').classList.remove('show');
  $('textInput').placeholder = 'اكتب رسالة...';
  $('progress').style.width = '0';
}

// لصق صورة من الحافظة
document.addEventListener('paste', (e) => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) setPending(item.getAsFile());
});

// ---------- رفع الملف مع شريط تقدم ----------
function sendFile(caption) {
  const fd = new FormData();
  fd.append('username', username);
  fd.append('caption', caption);
  fd.append('file', pendingFile);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/upload');
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) $('progress').style.width = (e.loaded / e.total * 100) + '%';
  };
  xhr.onload = () => {
    if (xhr.status === 200) {
      $('textInput').value = '';
      autoGrow();
      clearPending();
    } else {
      let msg = 'فشل الرفع';
      try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
      alert(msg);
      $('progress').style.width = '0';
    }
    $('sendBtn').disabled = false;
  };
  xhr.onerror = () => { alert('مشكلة في الاتصال'); $('sendBtn').disabled = false; };
  $('sendBtn').disabled = true;
  xhr.send(fd);
}

// ---------- عرض الصورة كبيرة ----------
$('lightbox').onclick = () => $('lightbox').classList.remove('show');
</script>
</body>
</html>
